<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <!-- Girih-style interlocking straps (repeating tile) -->
    <pattern id="girih" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M0 50 L50 0 L100 50 L50 100 Z" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
      <path d="M50 0 L50 100 M0 50 L100 50" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="0.8"/>
      <path d="M25 25 L75 25 L75 75 L25 75 Z" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="0.6"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#girih)"/>
</svg>
