<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Athan Clock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link id="theme-link" rel="stylesheet" href="themes/earthy-frame/theme.css">
    <link rel="stylesheet" href="overlays/ramadanOverlay.css">
</head>
<body>
    <div class="pattern" aria-hidden="true"></div>

    <header class="header-bar" id="header-bar">
        <span class="masjid-name" id="masjid-name">MET Mosque</span>
        <span class="last-updated" id="last-updated">Updated Feb 2026</span>
    </header>

    <div class="container">
        <div id="clock-display" class="clock-display">
            <!-- Main zone: time + next prayer + date line -->
            <div class="top-block">
                <div id="current-time" class="time">--:--:-- --</div>
                <div class="next-prayer-line" id="next-prayer-line">Next: — • —</div>
                <img src="themes/earthy-frame/divider.svg" alt="" class="clock-divider" width="500" height="8">
                <div id="dateLine" class="dateLine">--</div>
            </div>
            <!-- Legacy date (hidden when dateLine is used) -->
            <div class="date-display date-top" aria-hidden="true">
                <div class="gregorian-date" id="gregorian-date">February 6, 2026</div>
                <div class="hijri-date" id="hijri-date">Thursday, Sha'ban 15, 1447 AH</div>
            </div>

            <!-- Middle: prayer strip (5 columns, centered) -->
            <div class="prayer-bar-middle">
            <div class="prayerBar" id="prayer-times">
                <div class="prayerCell" data-prayer="fajr">
                    <span class="prayerName">Fajr</span>
                    <span class="prayerAdhan prayer-time" id="fajr-time">5:42 AM</span>
                    <span class="prayerIqama" id="fajr-iqama">Iqama —</span>
                </div>
                <div class="prayerCell" data-prayer="dhuhr">
                    <span class="prayerName">Dhuhr</span>
                    <span class="prayerAdhan prayer-time" id="dhuhr-time">12:34 PM</span>
                    <span class="prayerIqama" id="dhuhr-iqama">Iqama —</span>
                </div>
                <div class="prayerCell" data-prayer="asr">
                    <span class="prayerName">Asr</span>
                    <span class="prayerAdhan prayer-time" id="asr-time">3:45 PM</span>
                    <span class="prayerIqama" id="asr-iqama">Iqama —</span>
                </div>
                <div class="prayerCell" data-prayer="maghrib">
                    <span class="prayerName">Maghrib</span>
                    <span class="prayerAdhan prayer-time" id="maghrib-time">5:26 PM</span>
                    <span class="prayerIqama" id="maghrib-iqama">Iqama 5:36</span>
                </div>
                <div class="prayerCell" data-prayer="isha">
                    <span class="prayerName">Isha</span>
                    <span class="prayerAdhan prayer-time" id="isha-time">6:49 PM</span>
                    <span class="prayerIqama" id="isha-iqama">Iqama —</span>
                </div>
            </div>
            </div>
        </div>

        <div id="athan-display" class="athan-display hidden">
            <div class="athan-prayer-name" id="athan-prayer-name">FAJR</div>
            <div class="athan-time" id="athan-time">5:42 AM</div>
            <div class="athan-animation"></div>
        </div>

        <!-- Ramadan Countdown (shows 2 weeks before Ramadan) -->
        <div id="ramadan-countdown" class="ramadan-countdown hidden">
            <span id="ramadan-countdown-text">Ramadan begins in 14 days</span>
        </div>

    </div>

    <div id="ramadan-overlay" class="ramadan-overlay hidden">
        <div class="overlay-card">
            <h1 id="overlay-title"></h1>
            <div id="overlay-main">
                <span id="overlay-countdown"></span>
                <div id="overlay-dua"></div>
            </div>
            <p id="overlay-subtitle"></p>
            <p class="hint">Tap anywhere to dismiss</p>
        </div>
    </div>

    <audio id="athan-audio" preload="auto"></audio>
    <audio id="notification-audio" preload="auto"></audio>

    <script src="clock.js"></script>
</body>
</html>
